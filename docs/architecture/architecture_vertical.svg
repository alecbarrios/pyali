<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 1870" width="556" height="1870" role="img" aria-label="pyali process_fov, stages top to bottom" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1f2933">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="556" height="1870" fill="#fff"/>
<rect x="16" y="144" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="159" font-weight="bold">read_bin_mov</text>
<text x="25" y="173" fill="#5d6670" font-size="10">io.py</text>
<text x="25" y="187" >→ movie (T, H, W)</text>
<text x="25" y="201" fill="#0f766e">reads frames1.bin</text>
<rect x="16" y="248" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="263" font-weight="bold">reference_and_correlation_image</text>
<text x="25" y="277" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="25" y="291" >movie[:p.n_ref] (T, H, W)</text>
<text x="25" y="305" >→ reference_image (H, W), corr_image (H, W)</text>
<rect x="16" y="352" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="367" font-weight="bold">sharpen</text>
<text x="25" y="381" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="25" y="395" >→ bkg (H, W), I2 (H, W), blurred (H, W),</text>
<text x="25" y="409" >  h_lap (H, W), LoG, LoG_n, sharpened (H, W)</text>
<rect x="16" y="456" width="330" height="60" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="471" font-weight="bold">adaptive_background</text>
<text x="25" y="485" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="25" y="499" >movie (T, H, W) in place</text>
<rect x="16" y="546" width="330" height="60" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="561" font-weight="bold">motion_correct</text>
<text x="25" y="575" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="25" y="589" >movie (T, H, W) in place</text>
<rect x="16" y="636" width="330" height="60" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="651" font-weight="bold">clip_saturation</text>
<text x="25" y="665" fill="#5d6670" font-size="10">preprocess.py   if p.saturation_clip is not None</text>
<text x="25" y="679" >movie (T, H, W) in place</text>
<rect x="16" y="726" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="741" font-weight="bold">cell_segmentation</text>
<text x="25" y="755" fill="#5d6670" font-size="10">segmentation.py</text>
<text x="25" y="769" >→ regions, binary_map (H, W),</text>
<text x="25" y="783" >  spatial_footprints</text>
<rect x="16" y="830" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="845" font-weight="bold">drop_oversized_regions</text>
<text x="25" y="859" fill="#5d6670" font-size="10">segmentation.py</text>
<text x="25" y="873" >→ regions in place, binary_map (H, W) in place,</text>
<text x="25" y="887" >  dropped</text>
<rect x="16" y="934" width="330" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="949" font-weight="bold">save_mat_v73</text>
<text x="25" y="963" fill="#5d6670" font-size="10">io.py   if save and out_dir</text>
<text x="25" y="977" fill="#0f766e">writes ALI_Int_Result.mat</text>
<text x="25" y="991" >← I2, LoG_image, LoG_normalized, bkg, blurred,</text>
<text x="25" y="1005" >  h_lap, reference_image, sharpened</text>
<rect x="16" y="1052" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="1067" font-weight="bold">temporal_filter</text>
<text x="25" y="1081" fill="#5d6670" font-size="10">extract.py   if need_global_filter</text>
<text x="25" y="1095" >movie (T, H, W)</text>
<text x="25" y="1109" >→ filtered_movie (T, H, W)</text>
<rect x="16" y="1156" width="330" height="60" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="1171" font-weight="bold">dog_kernel</text>
<text x="25" y="1185" fill="#5d6670" font-size="10">utils.py</text>
<text x="25" y="1199" >→ dog (width,)</text>
<rect x="16" y="1246" width="330" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="1261" font-weight="bold">extract_footprints</text>
<text x="25" y="1275" fill="#5d6670" font-size="10">extract.py</text>
<text x="25" y="1289" >movie (T, H, W)</text>
<text x="25" y="1303" >→ APs, COMs, footprint (H, W, N),</text>
<text x="25" y="1317" >  footprint_center (N, 2)</text>
<rect x="16" y="1364" width="330" height="60" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="1379" font-weight="bold">per_pixel_noise_map</text>
<text x="25" y="1393" fill="#5d6670" font-size="10">extract.py   if p.whiten_traces</text>
<text x="25" y="1407" >→ noise_map (H, W)</text>
<rect x="16" y="1454" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="1469" font-weight="bold">extract_cell_traces</text>
<text x="25" y="1483" fill="#5d6670" font-size="10">extract.py</text>
<text x="25" y="1497" >movie (T, H, W)</text>
<text x="25" y="1511" >→ cell_traces (N, T)</text>
<rect x="16" y="1558" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="1573" font-weight="bold">save_mat_v73</text>
<text x="25" y="1587" fill="#5d6670" font-size="10">io.py   if save and out_dir</text>
<text x="25" y="1601" fill="#0f766e">writes ALI_Result.mat</text>
<text x="25" y="1615" >← cell_traces, footprint, footprint_center</text>
<rect x="16" y="1662" width="330" height="74" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="1677" font-weight="bold">write_metadata</text>
<text x="25" y="1691" fill="#5d6670" font-size="10">metadata.py   if save and out_dir</text>
<text x="25" y="1705" fill="#0f766e">writes fov_metadata.json</text>
<text x="25" y="1719" >← cell_traces, dropped, regions</text>
<rect x="16" y="1766" width="330" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="1781" font-weight="bold">save_result_figures</text>
<text x="25" y="1795" fill="#5d6670" font-size="10">figures.py   if make_figures and out_dir</text>
<text x="25" y="1809" fill="#0f766e">writes 5 files (html, png)</text>
<text x="25" y="1823" >← COMs, binary_map, cell_traces, footprint,</text>
<text x="25" y="1837" >  footprint_center, reference_image, regions</text>
