<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1892 982" width="1892" height="982" role="img" aria-label="pyali process_fov, stages left to right then down" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1f2933">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1892" height="982" fill="#fff"/>
<rect x="16" y="40" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="55" font-weight="bold">read_bin_mov</text>
<text x="25" y="69" fill="#5d6670" font-size="10">io.py</text>
<text x="25" y="83" >→ movie (T, H, W)</text>
<text x="25" y="97" fill="#0f766e">reads frames1.bin</text>
<rect x="402" y="40" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="411" y="55" font-weight="bold">reference_and_correlation_image</text>
<text x="411" y="69" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="411" y="83" >movie[:p.n_ref] (T, H, W)</text>
<text x="411" y="97" >→ reference_image (H, W),</text>
<text x="411" y="111" >  corr_image (H, W)</text>
<rect x="788" y="40" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="797" y="55" font-weight="bold">sharpen</text>
<text x="797" y="69" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="797" y="83" >→ bkg (H, W), I2 (H, W),</text>
<text x="797" y="97" >  blurred (H, W), h_lap (H, W),</text>
<text x="797" y="111" >  LoG, LoG_n, sharpened (H, W)</text>
<rect x="1174" y="40" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="1183" y="55" font-weight="bold">adaptive_background</text>
<text x="1183" y="69" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="1183" y="83" >movie (T, H, W) in place</text>
<rect x="1560" y="40" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="1569" y="55" font-weight="bold">motion_correct</text>
<text x="1569" y="69" fill="#5d6670" font-size="10">preprocess.py</text>
<text x="1569" y="83" >movie (T, H, W) in place</text>
<rect x="16" y="302" width="236" height="102" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="317" font-weight="bold">clip_saturation</text>
<text x="25" y="331" fill="#5d6670" font-size="10">preprocess.py   if p.saturation_clip is not None</text>
<text x="25" y="345" >movie (T, H, W) in place</text>
<rect x="402" y="302" width="236" height="102" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="411" y="317" font-weight="bold">cell_segmentation</text>
<text x="411" y="331" fill="#5d6670" font-size="10">segmentation.py</text>
<text x="411" y="345" >→ regions, binary_map (H, W),</text>
<text x="411" y="359" >  spatial_footprints</text>
<rect x="788" y="302" width="236" height="102" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="797" y="317" font-weight="bold">drop_oversized_regions</text>
<text x="797" y="331" fill="#5d6670" font-size="10">segmentation.py</text>
<text x="797" y="345" >→ regions in place,</text>
<text x="797" y="359" >  binary_map (H, W) in place,</text>
<text x="797" y="373" >  dropped</text>
<rect x="1174" y="302" width="236" height="102" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="1183" y="317" font-weight="bold">save_mat_v73</text>
<text x="1183" y="331" fill="#5d6670" font-size="10">io.py   if save and out_dir</text>
<text x="1183" y="345" fill="#0f766e">writes ALI_Int_Result.mat</text>
<text x="1183" y="359" >← I2, LoG_image, LoG_normalized,</text>
<text x="1183" y="373" >  bkg, blurred, h_lap,</text>
<text x="1183" y="387" >  reference_image, sharpened</text>
<rect x="1560" y="302" width="236" height="102" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="1569" y="317" font-weight="bold">temporal_filter</text>
<text x="1569" y="331" fill="#5d6670" font-size="10">extract.py   if need_global_filter</text>
<text x="1569" y="345" >movie (T, H, W)</text>
<text x="1569" y="359" >→ filtered_movie (T, H, W)</text>
<rect x="16" y="668" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="25" y="683" font-weight="bold">dog_kernel</text>
<text x="25" y="697" fill="#5d6670" font-size="10">utils.py</text>
<text x="25" y="711" >→ dog (width,)</text>
<rect x="402" y="668" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="411" y="683" font-weight="bold">extract_footprints</text>
<text x="411" y="697" fill="#5d6670" font-size="10">extract.py</text>
<text x="411" y="711" >movie (T, H, W)</text>
<text x="411" y="725" >→ APs, COMs, footprint (H, W, N),</text>
<text x="411" y="739" >  footprint_center (N, 2)</text>
<rect x="788" y="668" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="797" y="683" font-weight="bold">per_pixel_noise_map</text>
<text x="797" y="697" fill="#5d6670" font-size="10">extract.py   if p.whiten_traces</text>
<text x="797" y="711" >→ noise_map (H, W)</text>
<rect x="1174" y="668" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2"/>
<text x="1183" y="683" font-weight="bold">extract_cell_traces</text>
<text x="1183" y="697" fill="#5d6670" font-size="10">extract.py</text>
<text x="1183" y="711" >movie (T, H, W)</text>
<text x="1183" y="725" >→ cell_traces (N, T)</text>
<rect x="1560" y="668" width="236" height="88" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="1569" y="683" font-weight="bold">save_mat_v73</text>
<text x="1569" y="697" fill="#5d6670" font-size="10">io.py   if save and out_dir</text>
<text x="1569" y="711" fill="#0f766e">writes ALI_Result.mat</text>
<text x="1569" y="725" >← cell_traces, footprint,</text>
<text x="1569" y="739" >  footprint_center</text>
<rect x="16" y="840" width="236" height="102" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="25" y="855" font-weight="bold">write_metadata</text>
<text x="25" y="869" fill="#5d6670" font-size="10">metadata.py   if save and out_dir</text>
<text x="25" y="883" fill="#0f766e">writes fov_metadata.json</text>
<text x="25" y="897" >← cell_traces, dropped, regions</text>
<rect x="402" y="840" width="236" height="102" rx="4" fill="#fff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="411" y="855" font-weight="bold">save_result_figures</text>
<text x="411" y="869" fill="#5d6670" font-size="10">figures.py   if make_figures and out_dir</text>
<text x="411" y="883" fill="#0f766e">writes 5 files (html, png)</text>
<text x="411" y="897" >← COMs, binary_map, cell_traces,</text>
<text x="411" y="911" >  footprint, footprint_center,</text>
<text x="411" y="925" >  reference_image, regions</text>
